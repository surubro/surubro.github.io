<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Text Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f0f0f0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* Input Screen */
        #input-screen {
            background: white;
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #0066ff;
        }

        button {
            background: #0066ff;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #0052cc;
        }

        /* Fullscreen Text Screen */
        #fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            z-index: 1000;
            overflow: hidden;
        }

        #big-text {
            font-size: 12vw;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            padding: 20px;
            max-width: 90%;
            word-break: break-word;
            line-height: 1.1;
        }

        /* Instructions */
        .info {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- Input Screen -->
    <div id="input-screen">
        <h1>Enter Your Text</h1>
        <input type="text" id="text-input" placeholder="Type something..." autocomplete="off">
        <button onclick="showBigText()">Submit</button>
        <div class="info">Double-click the big text to go back</div>
    </div>

    <!-- Fullscreen Display -->
    <div id="fullscreen" ondblclick="hideBigText()">
        <div id="big-text"></div>
    </div>

    <script>
        function showBigText() {
            const input = document.getElementById('text-input');
            const text = input.value.trim();
            
            if (text === '') {
                alert('Please enter some text!');
                return;
            }

            // Set the big text
            document.getElementById('big-text').textContent = text;
            
            // Hide input screen
            document.getElementById('input-screen').style.display = 'none';
            
            // Show fullscreen
            const fullscreen = document.getElementById('fullscreen');
            fullscreen.style.display = 'flex';
        }

        function hideBigText() {
            // Hide fullscreen
            document.getElementById('fullscreen').style.display = 'none';
            
            // Show input screen again
            document.getElementById('input-screen').style.display = 'flex';
            
            // Optional: clear input for next use
            // document.getElementById('text-input').value = '';
        }

        // Allow pressing Enter key to submit
        document.getElementById('text-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                showBigText();
            }
        });

        // Bonus: Click anywhere on fullscreen also works (but double-click is required as per request)
        console.log('%cBig Text Display ready! Enter text and click Submit.', 'color: #0066ff; font-size: 14px;');
    </script>

</body>
</html>
