<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Text Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f0f0f0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* Input Screen */
        #input-screen {
            background: white;
            padding: 40px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #0066ff;
        }

        .btn {
            background: #0066ff;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #0052cc;
        }

        .btn-secondary {
            background: #28a745;
        }
        .btn-secondary:hover {
            background: #218838;
        }

        /* Saved Tags Area */
        .tags-section {
            text-align: left;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .tags-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .tag {
            background: #e1ecf4;
            color: #2c5777;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .tag:hover {
            background: #d0e4f2;
            transform: scale(1.03);
        }

        .tag-text {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .delete-tag {
            color: #ca3c3c;
            font-weight: bold;
            cursor: pointer;
            padding: 0 2px;
            border-radius: 50%;
        }

        .delete-tag:hover {
            background: rgba(202, 60, 60, 0.1);
        }

        /* Fullscreen Text Screen - Pitch Black */
        #fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            z-index: 1000;
            overflow: hidden;
        }

        #big-text {
            font-size: 12vw;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            padding: 20px;
            max-width: 90%;
            word-break: break-word;
            line-height: 1.1;
        }

        /* Instructions */
        .info {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="input-screen">
        <h1>Big Text Launcher</h1>
        
        <div class="input-group">
            <input type="text" id="text-input" placeholder="Type text..." autocomplete="off">
            <button class="btn" onclick="launchCustomText()">Go</button>
            <button class="btn btn-secondary" onclick="saveCurrentAsTag()">+ Tag</button>
        </div>

        <div class="tags-section">
            <div class="tags-title">Click a saved word to go Fullscreen instantly:</div>
            <div id="tags-container" class="tags-container">
                </div>
        </div>

        <div class="info">Double-click the big text (or press ESC) to go back</div>
    </div>

    <div id="fullscreen" ondblclick="hideBigText()">
        <div id="big-text"></div>
    </div>

    <script>
        const inputElement = document.getElementById('text-input');
        const fullscreenElement = document.getElementById('fullscreen');
        const tagsContainer = document.getElementById('tags-container');

        // Initial load from LocalStorage
        window.addEventListener('DOMContentLoaded', () => {
            renderTags();
            
            // Pre-fill the input box with whatever was last typed (optional convenience)
            const lastInput = localStorage.getItem('lastBigTextInput');
            if (lastInput) inputElement.value = lastInput;
        });

        // Get tags array from localStorage
        function getSavedTags() {
            const tags = localStorage.getItem('presetBigTags');
            return tags ? JSON.parse(tags) : ["HELLO", "STOP", "GO", "SLOW DOWN"]; // Default fallback tags if empty
        }

        // Render the tag buttons inside the container
        function renderTags() {
            const tags = getSavedTags();
            tagsContainer.innerHTML = '';

            if(tags.length === 0) {
                tagsContainer.innerHTML = '<span style="color: #aaa; font-style: italic; font-size: 13px;">No saved tags yet. Type above and click "+ Tag".</span>';
                return;
            }

            tags.forEach((tagText, index) => {
                const tagDiv = document.createElement('div');
                tagDiv.className = 'tag';
                // Clicking the tag body launches fullscreen immediately
                tagDiv.onclick = () => launchTextDirectly(tagText);

                const textSpan = document.createElement('span');
                textSpan.className = 'tag-text';
                textSpan.textContent = tagText;

                const deleteSpan = document.createElement('span');
                deleteSpan.className = 'delete-tag';
                deleteSpan.innerHTML = '&times;';
                // Stop click from launching fullscreen when trying to delete
                deleteSpan.onclick = (e) => {
                    e.stopPropagation(); 
                    deleteTag(index);
                };

                tagDiv.appendChild(textSpan);
                tagDiv.appendChild(deleteSpan);
                tagsContainer.appendChild(tagDiv);
            });
        }

        // Add current input value to the LocalStorage tag list
        function saveCurrentAsTag() {
            const text = inputElement.value.trim();
            if (!text) {
                alert('Type something in the box first to save it as a tag!');
                return;
            }

            const tags = getSavedTags();
            if (!tags.includes(text)) {
                tags.push(text);
                localStorage.setItem('presetBigTags', JSON.stringify(tags));
                renderTags();
            }
        }

        // Delete tag from LocalStorage
        function deleteTag(index) {
            const tags = getSavedTags();
            tags.splice(index, 1);
            localStorage.setItem('presetBigTags', JSON.stringify(tags));
            renderTags();
        }

        // Launch from the manual "Go" button
        function launchCustomText() {
            const text = inputElement.value.trim();
            if (!text) {
                alert('Please enter some text!');
                return;
            }
            localStorage.setItem('lastBigTextInput', text);
            launchTextDirectly(text);
        }

        // The core Fullscreen triggering engine
        function launchTextDirectly(text) {
            document.getElementById('big-text').textContent = text;
            document.getElementById('input-screen').style.display = 'none';
            fullscreenElement.style.display = 'flex';

            // Trigger True Browser Fullscreen (Hides URL bar and system menus entirely)
            if (fullscreenElement.requestFullscreen) {
                fullscreenElement.requestFullscreen();
            } else if (fullscreenElement.webkitRequestFullscreen) { /* Safari */
                fullscreenElement.webkitRequestFullscreen();
            } else if (fullscreenElement.msRequestFullscreen) { /* IE11 */
                fullscreenElement.msRequestFullscreen();
            }
        }

        function hideBigText() {
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
            resetToInputScreen();
        }

        function resetToInputScreen() {
            fullscreenElement.style.display = 'none';
            document.getElementById('input-screen').style.display = 'flex';
        }

        // Keep UI in sync if the user breaks fullscreen using the 'Esc' physical key
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) resetToInputScreen();
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) resetToInputScreen();
        });

        // Enter key shortcut inside input field
        inputElement.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') launchCustomText();
        });
    </script>
</body>
</html>
