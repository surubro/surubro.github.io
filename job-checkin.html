<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Check-In Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; color: #333; }
    header { background:#2E7D32; color:white; text-align:center; padding:15px; font-size:20px; font-weight:bold; }

    #loginDiv, #appDiv { padding:20px; max-width: 700px; margin: 0 auto; }

    input, button, select {
      width:100%;
      padding:12px;
      margin:6px 0;
      font-size:16px;
      border-radius:6px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    button {
      background:#2E7D32;
      color:white;
      font-weight:bold;
      border:none;
      cursor:pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1B5E20; }

    .box {
      background:white;
      padding:15px;
      margin-bottom:15px;
      border-radius:8px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .status-panel {
      text-align: center;
      font-weight: bold;
    }

    .btn-checkin { background: #4CAF50; }
    .btn-checkin:hover { background: #388E3C; }
    .btn-checkout { background: #f44336; }
    .btn-checkout:hover { background: #d32f2f; }
    .btn-secondary { background: #757575; }
    .btn-secondary:hover { background: #616161; }
    .btn-weekoff { background: #0288D1; }
    .btn-weekoff:hover { background: #01579B; }

    .flex-group { display: flex; gap: 10px; }
    .flex-wrap { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
    .flex-wrap button { flex: 1; min-width: 100px; margin: 0; }

    /* Calendar Design System */
    .calendar-container {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .weekday-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: bold;
      color: #666;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .calendar-day {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      min-height: 75px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-sizing: border-box;
    }
    .calendar-day:hover {
      background: #f0f0f0;
      transform: scale(1.02);
    }
    .calendar-day.empty {
      background: transparent;
      border: none;
      cursor: default;
      pointer-events: none;
    }
    .calendar-day.today {
      border: 2px solid #2196F3;
    }
    .calendar-day.has-logs {
      background: #E8F5E9;
      border-color: #A5D6A7;
    }
    .calendar-day.is-weekoff {
      background: #ECEFF1;
      border-color: #B0BEC5;
    }
    .day-number {
      font-weight: bold;
      font-size: 14px;
      color: #444;
    }
    .day-hours {
      font-size: 11px;
      font-weight: bold;
      color: #2E7D32;
      text-align: right;
    }
    .day-hours.weekoff-text {
      color: #455A64;
    }
    .day-timestamps {
      font-size: 9px;
      color: #777;
      margin-top: 4px;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

<header>⏱️ Job Check-In Tracker</header>

<div id="loginDiv">
  <div class="box">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="appDiv" style="display:none;">

  <div class="box status-panel">
    <h3>Current Status</h3>
    <div id="statusText" style="margin-bottom: 10px; font-size: 18px; color: #555;">Loading...</div>
    <div class="flex-group">
      <button id="checkInBtn" class="btn-checkin" onclick="handleCheckIn()">Check In</button>
      <button id="checkOutBtn" class="btn-checkout" onclick="handleCheckOut()" style="display:none;">Check Out</button>
    </div>
  </div>

  <div class="box">
    <h3>Monthly Scope</h3>
    <div class="flex-group">
      <select id="monthFilter" onchange="loadMonthlyLogs()"></select>
      <button onclick="openManualModal()" style="background: #0288D1; white-space: nowrap; width: auto;">+ Manual Log</button>
    </div>
    <div style="margin-top: 10px; font-weight: bold; text-align: right; font-size: 17px; color: #2E7D32;">
      Monthly Total: <span id="monthlyTotalHours">0h 0m</span>
    </div>
  </div>

  <div class="calendar-container">
    <div class="weekday-header">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="calendarGrid" class="calendar-grid"></div>
  </div>
  
  <button onclick="logout()" class="btn-secondary" style="margin-top: 20px;">Logout</button>
</div>

<div id="logModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Manage Attendance</h3>
    <input type="hidden" id="modalDate">
    
    <div style="margin-bottom: 12px; font-weight: bold; color: #2E7D32;">
      Selected Date: <span id="modalDateDisplay"></span>
    </div>
    
    <div id="modalFormFields">
      <label for="modalCheckIn">Check-In Time:</label>
      <input type="time" id="modalCheckIn">
      
      <label for="modalCheckOut">Check-Out Time (Leave empty if active):</label>
      <input type="time" id="modalCheckOut">
    </div>
    
    <div class="flex-wrap">
      <button onclick="saveLog()" style="background: #4CAF50;">Save Logs</button>
      <button id="btnWeekOff" onclick="saveWeekOff()" class="btn-weekoff">Mark Week Off</button>
      <button id="btnDeleteLog" onclick="deleteLog()" style="background: #f44336; display: none;">Clear Day</button>
      <button onclick="closeManualModal()" class="btn-secondary">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",
    authDomain: "striped-acrobat-342207.firebaseapp.com",
    databaseURL: "https://striped-acrobat-342207-default-rtdb.firebaseio.com",
    projectId: "striped-acrobat-342207",
    storageBucket: "striped-acrobat-342207.appspot.com",
    messagingSenderId: "367114842706",
    appId: "1:367114842706:web:0f6d504163ed3c72ed658b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth();

  let currentUser = null;
  let currentStatusListener = null;
  let monthlyLogsListener = null;

  const getLocalDateString = (date) => {
    const offset = date.getTimezoneOffset();
    const cleanDate = new Date(date.getTime() - (offset * 60 * 1000));
    return cleanDate.toISOString().split('T')[0];
  };

  // Setup month selectors
  const monthFilter = document.getElementById("monthFilter");
  const initMonthDropdown = () => {
    monthFilter.innerHTML = "";
    const d = new Date();
    const currentYearMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    
    for (let i = 0; i < 6; i++) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const option = document.createElement("option");
      option.value = `${y}-${m}`;
      option.innerText = d.toLocaleString('default', { month: 'long', year: 'numeric' });
      monthFilter.appendChild(option);
      d.setMonth(d.getMonth() - 1);
    }
    monthFilter.value = currentYearMonth;
  };
  initMonthDropdown();

  // Auth monitoring
  onAuthStateChanged(auth, user => {
    currentUser = user;
    loginDiv.style.display = user ? "none" : "block";
    appDiv.style.display = user ? "block" : "none";

    if (user) {
      setupRealtimeTracker();
      loadMonthlyLogs();
    } else {
      if (currentStatusListener) currentStatusListener();
      if (monthlyLogsListener) monthlyLogsListener();
    }
  });

  window.login = () =>
    signInWithEmailAndPassword(auth, email.value, password.value).catch(e => alert(e.message));

  window.logout = () => signOut(auth);

  const formatTime = (isoString) => {
    if (!isoString) return "--:--";
    return new Date(isoString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  };

  const calculateDuration = (inIso, outIso) => {
    if (!inIso || !outIso) return 0;
    return Math.max(0, new Date(outIso) - new Date(inIso));
  };

  const formatDuration = (ms) => {
    const mins = Math.floor(ms / 1000 / 60);
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${h}h ${m}m`;
  };

  // Status block management
  function setupRealtimeTracker() {
    const todayStr = getLocalDateString(new Date());
    const currentMonthStr = todayStr.substring(0, 7);
    const statusRef = ref(db, `jobcheckin/${currentUser.uid}/${currentMonthStr}/${todayStr}`);
    
    if (currentStatusListener) currentStatusListener();

    currentStatusListener = onValue(statusRef, snap => {
      const data = snap.val();
      const checkInBtn = document.getElementById("checkInBtn");
      const checkOutBtn = document.getElementById("checkOutBtn");
      const statusText = document.getElementById("statusText");

      if (data && data.status === "Week Off") {
        statusText.innerText = "Today is marked as your Week Off 🏖️";
        checkInBtn.style.display = "block";
        checkInBtn.innerText = "🔄 Override & Check In";
        checkOutBtn.style.display = "none";
      } else if (data && data.checkIn && !data.checkOut) {
        statusText.innerText = `Checked in at: ${formatTime(data.checkIn)}`;
        checkInBtn.style.display = "none";
        checkOutBtn.style.display = "block";
      } else if (data && data.checkIn && data.checkOut) {
        statusText.innerText = `Shift completed today. Total: ${formatDuration(calculateDuration(data.checkIn, data.checkOut))}`;
        checkInBtn.style.display = "block";
        checkInBtn.innerText = "🔄 Check In Again";
        checkOutBtn.style.display = "none";
      } else {
        statusText.innerText = "Not checked in today";
        checkInBtn.style.display = "block";
        checkInBtn.innerText = "Check In";
        checkOutBtn.style.display = "none";
      }
    });
  }

  window.handleCheckIn = () => {
    const now = new Date();
    const todayStr = getLocalDateString(now);
    const currentMonthStr = todayStr.substring(0, 7);
    const dayRef = ref(db, `jobcheckin/${currentUser.uid}/${currentMonthStr}/${todayStr}`);
    set(dayRef, { checkIn: now.toISOString(), checkOut: null, status: "Working" });
  };

  window.handleCheckOut = () => {
    const now = new Date();
    const todayStr = getLocalDateString(now);
    const currentMonthStr = todayStr.substring(0, 7);
    const dayRef = ref(db, `jobcheckin/${currentUser.uid}/${currentMonthStr}/${todayStr}`);
    
    onValue(dayRef, snap => {
      const data = snap.val();
      let checkInDate = data && data.checkIn ? new Date(data.checkIn) : null;
      let checkOutDate = now;
      if (checkInDate && checkOutDate < checkInDate) {
        checkOutDate.setDate(checkOutDate.getDate() + 1);
      }
      update(dayRef, { checkOut: checkOutDate.toISOString() });
    }, { onlyOnce: true });
  };

  // Calendar Grid Builder & Month Listener
  window.loadMonthlyLogs = () => {
    const targetMonth = monthFilter.value; // Format: YYYY-MM
    const [year, month] = targetMonth.split("-").map(Number);
    
    const monthlyRef = ref(db, `jobcheckin/${currentUser.uid}/${targetMonth}`);
    
    if (monthlyLogsListener) monthlyLogsListener();

    monthlyLogsListener = onValue(monthlyRef, snap => {
      const dbData = snap.exists() ? snap.val() : {};
      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";
      
      let totalMonthMs = 0;

      // Calendar structural mechanics
      const firstDayIndex = new Date(year, month - 1, 1).getDay(); 
      const totalDaysInMonth = new Date(year, month, 0).getDate();
      const todayStr = getLocalDateString(new Date());

      // Padding grid elements for layout balance
      for (let i = 0; i < firstDayIndex; i++) {
        const padCell = document.createElement("div");
        padCell.className = "calendar-day empty";
        grid.appendChild(padCell);
      }

      // Generate actual days
      for (let day = 1; day <= totalDaysInMonth; day++) {
        const dateString = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayRecord = dbData[dateString];

        const dayCell = document.createElement("div");
        dayCell.className = "calendar-day";
        if (dateString === todayStr) dayCell.classList.add("today");

        let cellHoursMarkup = "";
        let cellTimestampMarkup = "";

        if (dayRecord) {
          if (dayRecord.status === "Week Off") {
            dayCell.classList.add("is-weekoff");
            cellHoursMarkup = `<span class="weekoff-text">Week Off</span>`;
            cellTimestampMarkup = `
              <div class="day-timestamps" style="color: #607D8B; font-weight: bold; text-align: center; margin-top: 8px;">
                🏖️ Off Day
              </div>
            `;
          } else {
            dayCell.classList.add("has-logs");
            const dayMs = calculateDuration(dayRecord.checkIn, dayRecord.checkOut);
            totalMonthMs += dayMs;

            cellHoursMarkup = dayMs > 0 ? formatDuration(dayMs) : (dayRecord.checkIn ? "Active" : "");
            cellTimestampMarkup = `
              <div class="day-timestamps">
                In: ${formatTime(dayRecord.checkIn)}<br>
                Out: ${formatTime(dayRecord.checkOut)}
              </div>
            `;
          }
        }

        dayCell.innerHTML = `
          <div class="day-number">${day}</div>
          <div class="day-hours">${cellHoursMarkup}</div>
          ${cellTimestampMarkup}
        `;

        // Direct day block interactions
        dayCell.onclick = () => {
          if (dayRecord) {
            openFormModal(dateString, dayRecord.checkIn || "", dayRecord.checkOut || "", dayRecord.status || "Working");
          } else {
            openFormModal(dateString, "", "", "Working");
          }
        };

        grid.appendChild(dayCell);
      }

      document.getElementById("monthlyTotalHours").innerText = formatDuration(totalMonthMs);
    });
  };

  // Modal Controllers
  const modal = document.getElementById("logModal");
  
  window.openManualModal = () => {
    openFormModal(getLocalDateString(new Date()), "", "", "Working");
  };

  function openFormModal(dateStr, checkInIso, checkOutIso, currentStatus) {
    document.getElementById("modalDate").value = dateStr;
    document.getElementById("modalDateDisplay").innerText = dateStr;

    const inTime = checkInIso ? new Date(checkInIso).toTimeString().substring(0,5) : "";
    const outTime = checkOutIso ? new Date(checkOutIso).toTimeString().substring(0,5) : "";
    
    document.getElementById("modalCheckIn").value = inTime;
    document.getElementById("modalCheckOut").value = outTime;
    
    // Toggle fields based on status profile
    const formFields = document.getElementById("modalFormFields");
    const btnWeekOff = document.getElementById("btnWeekOff");
    
    if (currentStatus === "Week Off") {
      formFields.style.display = "none";
      btnWeekOff.style.display = "none";
    } else {
      formFields.style.display = "block";
      btnWeekOff.style.display = "block";
    }

    // Toggle delete button exposure conditionally
    document.getElementById("btnDeleteLog").style.display = (checkInIso || currentStatus === "Week Off") ? "block" : "none";
    modal.style.display = "flex";
  }

  window.closeManualModal = () => { modal.style.display = "none"; };

  window.saveLog = () => {
    const dateVal = document.getElementById("modalDate").value;
    const inTimeVal = document.getElementById("modalCheckIn").value;
    const outTimeVal = document.getElementById("modalCheckOut").value;

    if (!dateVal || !inTimeVal) {
      alert("Check-In time is mandatory.");
      return;
    }

    const monthStr = dateVal.substring(0, 7);
    const targetRef = ref(db, `jobcheckin/${currentUser.uid}/${monthStr}/${dateVal}`);

    let checkInDate = new Date(`${dateVal}T${inTimeVal}`);
    let checkOutDate = null;

  if (outTimeVal) {
      checkOutDate = new Date(`${dateVal}T${outTimeVal}`);
      if (checkOutDate < checkInDate) {
        checkOutDate.setDate(checkOutDate.getDate() + 1); // Auto midnight conversion shift
      }
    }

    set(targetRef, {
      checkIn: checkInDate.toISOString(),
      checkOut: checkOutDate ? checkOutDate.toISOString() : null,
      status: "Working"
    }).then(() => {
      closeManualModal();
      if(monthFilter.value !== monthStr) {
        monthFilter.value = monthStr;
        loadMonthlyLogs();
      }
    });
  };

  window.saveWeekOff = () => {
    const dateVal = document.getElementById("modalDate").value;
    if (!dateVal) return;

    const monthStr = dateVal.substring(0, 7);
    const targetRef = ref(db, `jobcheckin/${currentUser.uid}/${monthStr}/${dateVal}`);

    set(targetRef, {
      status: "Week Off"
    }).then(() => {
      closeManualModal();
      if(monthFilter.value !== monthStr) {
        monthFilter.value = monthStr;
        loadMonthlyLogs();
      }
    });
  };

  window.deleteLog = () => {
    const dateStr = document.getElementById("modalDate").value;
    if (confirm(`Remove records for ${dateStr}?`)) {
      const monthStr = dateStr.substring(0, 7);
      remove(ref(db, `jobcheckin/${currentUser.uid}/${monthStr}/${dateStr}`)).then(() => {
        closeManualModal();
      });
    }
  };
</script>

</body>
</html>
