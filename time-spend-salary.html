<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary & Time-Cost Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h3 { color: #34495e; font-size: 1.1rem; margin-top: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; background-color: #4a90e2; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: background 0.3s; }
        button:hover { background-color: #357abd; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #e8f4fd; border-radius: 6px; border-left: 4px solid #4a90e2; }
        .rate-display { font-weight: bold; color: #27ae60; }
        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Time-Cost Tool</h2>
    
    <div class="input-group">
        <label>Monthly Salary</label>
        <input type="number" id="monthlySalary" placeholder="Enter amount">
    </div>
    <div class="input-group">
        <label>Monthly Working Hours</label>
        <input type="number" id="workingHours" placeholder="e.g., 160">
    </div>
    <button id="setRate">Set Hourly Rate</button>

    <hr>

    <div class="input-group">
        <h3>Buying Something?</h3>
        <p>Your Rate: <strong><span id="displayRate">0.00</span></strong> per hour</p>
        <label>Item Price</label>
        <input type="number" id="itemPrice" placeholder="Price of the item">
    </div>
    <button id="calculateTime">Calculate "Life" Cost</button>

    <div id="result" class="result-box" style="display:none;">
        </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Your provided Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",
      authDomain: "striped-acrobat-342207.firebaseapp.com",
      databaseURL: "https://striped-acrobat-342207-default-rtdb.firebaseio.com",
      projectId: "striped-acrobat-342207",
      storageBucket: "striped-acrobat-342207.appspot.com",
      messagingSenderId: "367114842706",
      appId: "1:367114842706:web:0f6d504163ed3c72ed658b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let hourlyRate = 0;

    // 1. Calculate the Hourly Rate
    document.getElementById('setRate').addEventListener('click', () => {
        const salary = parseFloat(document.getElementById('monthlySalary').value);
        const hours = parseFloat(document.getElementById('workingHours').value);

        if (salary > 0 && hours > 0) {
            hourlyRate = salary / hours;
            document.getElementById('displayRate').innerText = hourlyRate.toFixed(2);
            alert("Rate set successfully!");
        } else {
            alert("Please enter valid numbers for salary and hours.");
        }
    });

    // 2. Calculate Item Cost in Hours and save to Firebase
    document.getElementById('calculateTime').addEventListener('click', () => {
        const price = parseFloat(document.getElementById('itemPrice').value);
        const resultDiv = document.getElementById('result');

        if (hourlyRate <= 0) {
            alert("Please set your hourly rate first.");
            return;
        }

        if (price > 0) {
            const hoursNeeded = (price / hourlyRate).toFixed(2);
            
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `This purchase will cost you <strong>${hoursNeeded} hours</strong> of work.`;

            // Push calculation to Firebase
            try {
                const logsRef = ref(db, 'calculations');
                push(logsRef, {
                    price: price,
                    workHoursValue: hoursNeeded,
                    hourlyRateUsed: hourlyRate.toFixed(2),
                    timestamp: new Date().toLocaleString()
                });
            } catch (error) {
                console.error("Firebase error:", error);
            }
        }
    });
</script>

</body>
</html>
