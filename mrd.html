<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelf Life Search - Restaurant Excellence</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e8e8e8;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 25px 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    header p {
      color: #a0aec0;
      font-size: 0.95rem;
    }

    .search-box {
      position: relative;
      margin-bottom: 25px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 20px 16px 50px;
      font-size: 1.1rem;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box input::placeholder {
      color: #718096;
    }

    .search-box input:focus {
      border-color: #e94560;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #718096;
      font-size: 1.2rem;
      pointer-events: none;
    }

    .result-count {
      text-align: center;
      color: #a0aec0;
      font-size: 0.9rem;
      margin-bottom: 15px;
      min-height: 20px;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px 22px;
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 15px;
      align-items: center;
      transition: all 0.25s ease;
      animation: fadeIn 0.3s ease;
    }

    .card:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(233, 69, 96, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .item-code {
      background: linear-gradient(135deg, #e94560, #c23a51);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 0;
      border-radius: 8px;
      text-align: center;
      min-width: 70px;
    }

    .item-name {
      font-size: 1.05rem;
      font-weight: 500;
      color: #f0f0f0;
      word-break: break-word;
    }

    .shelf-life {
      background: rgba(72, 187, 120, 0.15);
      color: #68d391;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(72, 187, 120, 0.3);
      white-space: nowrap;
      text-align: center;
    }

    .shelf-life.short {
      background: rgba(245, 101, 101, 0.15);
      color: #fc8181;
      border-color: rgba(245, 101, 101, 0.3);
    }

    .shelf-life.medium {
      background: rgba(237, 137, 54, 0.15);
      color: #f6ad55;
      border-color: rgba(237, 137, 54, 0.3);
    }

    .no-results {
      text-align: center;
      padding: 50px 20px;
      color: #718096;
      font-size: 1.1rem;
    }

    .no-results span {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #4a5568;
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.4rem;
      }

      .card {
        grid-template-columns: 1fr;
        gap: 10px;
        text-align: center;
      }

      .item-code {
        width: 80px;
        margin: 0 auto;
      }

      .shelf-life {
        justify-self: center;
      }
    }
  </style>

    const resultCount = document.getElementById('resultCount');
    document.getElementById('totalItems').textContent = data.length;

    function getShelfClass(shelf) {
      const s = shelf.toLowerCase();
      if (s.includes('min') || s.includes('eod') || s === 'na' ||
          s.includes('2 hour') || s.includes('3 hour') || s.includes('4 hour') ||
          s.includes('5 hour') || s.includes('6 hour') || s.includes('7 min')) {
        return 'short';
      }
      if (s.includes('12 hour') || s.includes('24 hour') || s.includes('day 1') ||
          s.includes('day 2') || s.includes('day 3')) {
        return 'medium';
      }
      return '';
    }

    function render(items) {
      if (items.length === 0) {
        resultsDiv.innerHTML = `
          <div class="no-results">
            <span>🔎</span>
            No items found. Try a different name or code.
          </div>`;
        resultCount.textContent = '';
        return;
      }

      resultCount.textContent = `Showing ${items.length} item${items.length > 1 ? 's' : ''}`;
      resultsDiv.innerHTML = items.map(item => `
        <div class="card">
          <div class="item-code">${item.code}</div>
          <div class="item-name">${item.name}</div>
          <div class="shelf-life ${getShelfClass(item.shelf)}">${item.shelf}</div>
        </div>
      `).join('');
    }

    function search() {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) {
        render(data);
        return;
      }
      const filtered = data.filter(item =>
        item.name.toLowerCase().includes(query) ||
        String(item.code).includes(query)
      );
      render(filtered);
    }

    searchInput.addEventListener('input', search);
    // Show all items on load
    render(data);
  </script>
