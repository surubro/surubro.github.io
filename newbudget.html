
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Budget Tracker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f7;
  color: #222;
}

header {
  background: #168b57;
  color: white;
  text-align: center;
  padding: 18px;
  font-size: 21px;
  font-weight: bold;
}

.container {
  padding: 15px;
  max-width: 650px;
  margin: auto;
}

.box {
  background: white;
  padding: 16px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px #00000012;
}

h3 {
  margin-top: 0;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #ddd;
  border-radius: 7px;
  font-size: 16px;
}

button {
  border: none;
  background: #168b57;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: .8;
}

.logout {
  background: #555;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  text-align: center;
}

.summary div {
  padding: 12px 5px;
  background: #f5f5f5;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.summary small {
  display: block;
  margin-bottom: 8px;
  color: #666;
}

.summary strong {
  font-size: 17px;
}

.salary { color: #673ab7; }
.spent { color: #e53935; }
.remaining { color: #168b57; }

.item {
  background: white;
  padding: 13px;
  margin: 9px 0;
  border-radius: 8px;
  box-shadow: 0 2px 5px #00000010;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.item-info {
  min-width: 0;
  overflow-wrap: anywhere;
}

.item-info small {
  color: #777;
}

.actions {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.actions button {
  width: auto;
  padding: 8px 10px;
  font-size: 13px;
}

.edit {
  background: #2196f3;
}

.delete {
  background: #e53935;
}

.category-row {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid #eee;
}

.progress {
  height: 9px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 6px;
}

.progress div {
  height: 100%;
  background: #168b57;
  width: 0%;
}

.negative {
  color: #e53935 !important;
}

.empty {
  text-align: center;
  color: #888;
  padding: 20px;
}

#appDiv {
  display: none;
}

</style>
</head>

<body>

<header>💰 Monthly Budget Tracker</header>

<!-- LOGIN -->

<div id="loginDiv" class="container">
  <div class="box">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
  </div>
</div>

<!-- MAIN APP -->

<div id="appDiv" class="container">

  <!-- SALARY -->

  <div class="box">
    <h3>💵 Monthly Salary</h3>

    <input
      type="number"
      id="salaryInput"
      placeholder="Enter monthly salary"
      min="0"
      step="0.01"
    >

    <button id="saveSalaryBtn">Save / Update Salary</button>
  </div>

  <!-- SUMMARY -->

  <div class="box">
    <h3>📊 Monthly Summary</h3>

    <div class="summary">

      <div>
        <small>Salary</small>
        <strong class="salary">₹<span id="salary">13000.00</span></strong>
      </div>

      <div>
        <small>Expenses</small>
        <strong class="spent">₹<span id="totalExpense">0.00</span></strong>
      </div>

      <div>
        <small>Remaining</small>
        <strong class="remaining" id="remainingBox">
          ₹<span id="remaining">13000.00</span>
        </strong>
      </div>

    </div>

    <p id="budgetStatus"></p>

    <div class="progress">
      <div id="budgetProgress"></div>
    </div>
  </div>

  <!-- ADD EXPENSE -->

  <div class="box">
    <h3>➕ Add Expense</h3>

    <input
      type="text"
      id="description"
      placeholder="Expense description"
    >

    <select id="category">
      <option value="Travel">🚆 Travel</option>
      <option value="Groceries">🛒 Groceries</option>
      <option value="Food">🍔 Food</option>
      <option value="Rent">🏠 Rent</option>
      <option value="Bills">💡 Bills</option>
      <option value="Shopping">🛍️ Shopping</option>
      <option value="Medical">💊 Medical</option>
      <option value="Savings">🏦 Savings</option>
      <option value="Other">📦 Other</option>
    </select>

    <input
      type="number"
      id="amount"
      placeholder="Amount (₹)"
      min="0.01"
      step="0.01"
    >

    <button id="addExpenseBtn">Add Expense</button>
  </div>

  <!-- CATEGORY BREAKDOWN -->

  <div class="box">
    <h3>📁 Category Breakdown</h3>
    <div id="categoryBreakdown"></div>
  </div>

  <!-- EXPENSE LIST -->

  <div class="box">
    <h3>📋 All Expenses</h3>
    <div id="expenseList"></div>
  </div>

  <button class="logout" id="logoutBtn">Logout</button>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  update,
  remove,
  onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",
  authDomain: "striped-acrobat-342207.firebaseapp.com",
  databaseURL: "https://striped-acrobat-342207-default-rtdb.firebaseio.com",
  projectId: "striped-acrobat-342207",
  storageBucket: "striped-acrobat-342207.appspot.com",
  messagingSenderId: "367114842706",
  appId: "1:367114842706:web:0f6d504163ed3c72ed658b"
};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);


// NEW DATABASE PATH
// Existing Money 1 data remains untouched.

const budgetRef = ref(db, "salaryBudget13000");
const salaryRef = ref(db, "salaryBudget13000/salary");
const expensesRef = ref(db, "salaryBudget13000/expenses");


// APP DATA

let currentSalary = 13000;
let expenses = {};


// ELEMENTS

const $ = id => document.getElementById(id);

const loginDiv = $("loginDiv");
const appDiv = $("appDiv");


// LOGIN

$("loginBtn").addEventListener("click", async () => {

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    alert("Enter email and password");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    alert(error.message);
  }

});


// AUTH STATE

let unsubscribeSalary = null;
let unsubscribeExpenses = null;

onAuthStateChanged(auth, user => {

  loginDiv.style.display = user ? "none" : "block";
  appDiv.style.display = user ? "block" : "none";

  if (unsubscribeSalary) {
    unsubscribeSalary();
    unsubscribeSalary = null;
  }

  if (unsubscribeExpenses) {
    unsubscribeExpenses();
    unsubscribeExpenses = null;
  }

  if (user) {
    startApp();
  }

});


// START APP

function startApp() {

  unsubscribeSalary = onValue(salaryRef, snap => {

    currentSalary = snap.exists()
      ? Number(snap.val())
      : 13000;

    $("salaryInput").value = currentSalary;

    renderSummary();

  });

  unsubscribeExpenses = onValue(expensesRef, snap => {

    expenses = snap.exists() ? snap.val() : {};

    renderAll();

  });

}


// SAVE SALARY

$("saveSalaryBtn").addEventListener("click", async () => {

  const salary = Number($("salaryInput").value);

  if (!Number.isFinite(salary) || salary < 0) {
    alert("Enter a valid salary");
    return;
  }

  try {
    await set(salaryRef, salary);
    alert("Salary updated successfully!");
  } catch (error) {
    alert(error.message);
  }

});


// ADD EXPENSE

$("addExpenseBtn").addEventListener("click", async () => {

  const description = $("description").value.trim();
  const category = $("category").value;
  const amount = Number($("amount").value);

  if (!description) {
    alert("Enter expense description");
    return;
  }

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Enter a valid amount");
    return;
  }

  try {

    await push(expensesRef, {
      description,
      category,
      amount,
      createdAt: Date.now()
    });

    $("description").value = "";
    $("amount").value = "";

  } catch (error) {
    alert(error.message);
  }

});


// EDIT EXPENSE

async function editExpense(id) {

  const item = expenses[id];

  if (!item) return;

  const newDescription = prompt(
    "Edit description:",
    item.description
  );

  if (newDescription === null) return;

  if (!newDescription.trim()) {
    alert("Description cannot be empty");
    return;
  }

  const newCategory = prompt(
    "Edit category:\nTravel, Groceries, Food, Rent, Bills, Shopping, Medical, Savings, Other",
    item.category
  );

  if (newCategory === null) return;

  const newAmount = prompt(
    "Edit amount:",
    item.amount
  );

  if (newAmount === null) return;

  const amount = Number(newAmount);
  const category = newCategory.trim();

  if (!Number.isFinite(amount) || amount <= 0 || !category) {
    alert("Invalid expense details");
    return;
  }

  try {

    await update(ref(db, "salaryBudget13000/expenses/" + id), {
      description: newDescription.trim(),
      category,
      amount
    });

  } catch (error) {
    alert(error.message);
  }

}


// DELETE EXPENSE

async function deleteExpense(id) {

  if (!confirm("Are you sure you want to delete this expense?")) {
    return;
  }

  try {
    await remove(ref(db, "salaryBudget13000/expenses/" + id));
  } catch (error) {
    alert(error.message);
  }

}


// RENDER SUMMARY

function renderSummary() {

  const total = Object.values(expenses).reduce(
    (sum, item) => sum + (Number(item.amount) || 0),
    0
  );

  const remaining = currentSalary - total;

  $("salary").textContent = currentSalary.toFixed(2);
  $("totalExpense").textContent = total.toFixed(2);
  $("remaining").textContent = remaining.toFixed(2);

  $("remainingBox").classList.toggle("negative", remaining < 0);

  const percentage = currentSalary > 0
    ? (total / currentSalary) * 100
    : (total > 0 ? 100 : 0);

  $("budgetProgress").style.width =
    Math.min(percentage, 100) + "%";

  if (remaining < 0) {
    $("budgetStatus").textContent =
      "⚠️ You have exceeded your salary by ₹" +
      Math.abs(remaining).toFixed(2);
  } else {
    $("budgetStatus").textContent =
      "You have used " + percentage.toFixed(1) +
      "% of your salary.";
  }

}


// RENDER EXPENSES AND CATEGORIES

function renderAll() {

  const list = $("expenseList");
  const breakdown = $("categoryBreakdown");

  list.replaceChildren();
  breakdown.replaceChildren();

  const categoryTotals = {};
  const items = Object.entries(expenses);

  if (items.length === 0) {

    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No expenses added yet.";
    list.appendChild(empty);

  }

  items.sort((a, b) =>
    (Number(b[1].createdAt) || 0) -
    (Number(a[1].createdAt) || 0)
  );

  items.forEach(([id, item]) => {

    const amount = Number(item.amount) || 0;
    const category = item.category || "Other";

    categoryTotals[category] =
      (categoryTotals[category] || 0) + amount;

    const card = document.createElement("div");
    card.className = "item";

    const info = document.createElement("div");
    info.className = "item-info";

    const title = document.createElement("strong");
    title.textContent = item.description || "Expense";

    const details = document.createElement("small");
    details.textContent =
      category + " · ₹" + amount.toFixed(2);

    info.append(title, document.createElement("br"), details);

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.className = "edit";
    edit.textContent = "Edit";
    edit.addEventListener("click", () => editExpense(id));

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "Delete";
    del.addEventListener("click", () => deleteExpense(id));

    actions.append(edit, del);
    card.append(info, actions);

    list.appendChild(card);

  });


  // CATEGORY BREAKDOWN

  const categories = Object.entries(categoryTotals)
    .sort((a, b) => b[1] - a[1]);

  if (categories.length === 0) {

    breakdown.textContent = "No expenses to display.";

  }

  categories.forEach(([category, amount]) => {

    const row = document.createElement("div");
    row.className = "category-row";

    const name = document.createElement("span");
    name.textContent = category;

    const value = document.createElement("strong");
    value.textContent = "₹" + amount.toFixed(2);

    row.append(name, value);
    breakdown.appendChild(row);

  });

  renderSummary();

}


// LOGOUT

$("logoutBtn").addEventListener("click", async () => {

  try {
    await signOut(auth);
  } catch (error) {
    alert(error.message);
  }

});

</script>

</body>
</html>
