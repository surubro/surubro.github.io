<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Money Manager 2 Tally — Dual Managers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Speed up Firebase module fetch -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://striped-acrobat-342207-default-rtdb.firebaseio.com" crossorigin>
  <link rel="dns-prefetch" href="https://striped-acrobat-342207-default-rtdb.firebaseio.com">

  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }
    header { background:#4CAF50; color:white; text-align:center; padding:15px; font-size:20px; font-weight:bold; }

    #loginDiv, #appDiv { padding:20px; }

    input, button {
      width:100%;
      padding:10px;
      margin:6px 0;
      font-size:16px;
      border-radius:6px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    button {
      background:#4CAF50;
      color:white;
      font-weight:bold;
      border:none;
      cursor:pointer;
    }

    /* ===== LOADING OVERLAY ===== */
    #loading {
      position:fixed;
      inset:0;
      background:#f5f5f5;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      z-index:9999;
      color:#4CAF50;
      font-weight:bold;
      font-size:16px;
    }
    .spinner {
      width:38px;
      height:38px;
      border:4px solid #c8e6c9;
      border-top-color:#4CAF50;
      border-radius:50%;
      animation:spin .9s linear infinite;
      margin-bottom:12px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ===== SPACE SWITCHER TABS ===== */
    .tabs {
      display:flex;
      gap:10px;
      margin-bottom:15px;
    }
    .tabs button {
      flex:1;
      margin:0;
      background:#e0e0e0;
      color:#333;
      border:2px solid transparent;
      transition:background .15s, color .15s;
    }
    .tabs button.active {
      background:#4CAF50;
      color:#fff;
      border-color:#2e7d32;
    }

    .space-label {
      text-align:center;
      font-weight:bold;
      color:#4CAF50;
      margin-bottom:12px;
      font-size:15px;
    }

    .box {
      background:white;
      padding:15px;
      margin-bottom:15px;
      border-radius:8px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    /* two opening boxes side by side */
    .openings {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      align-items:start;
    }
    .openings .sub { padding:10px; border-radius:8px; }
    .openings .sub.original { background:#f3e5f5; }
    .openings .sub.whatif   { background:#e3f2fd; }

    /* collapsible headers (used by What-If + Tally) */
    .head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      cursor:pointer;
      user-select:none;
      margin:0;
      font-size:14px;
      font-weight:bold;
    }
    .head .arrow {
      font-size:12px;
      transition:transform .2s;
    }
    .head.collapsed .arrow { transform:rotate(-90deg); }

    .openings .original .head,
    .openings .original h4   { color:#673ab7; }
    .openings .whatif   .head,
    .openings .whatif   h4   { color:#1976d2; }

    /* Tally header colour */
    #tallyHead { font-size:16px; color:#4CAF50; }

    .body { overflow:hidden; }

    /* tally */
    .tally {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      text-align:center;
      font-weight:bold;
      margin-bottom:10px;
    }
    .tally2 {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      text-align:center;
      font-weight:bold;
    }

    .opening   { color:#673ab7; }
    .whatif    { color:#1976d2; }
    .expense   { color:#f44336; }
    .balance   { color:#333; }
    .balance-w { color:#1976d2; }

    .card {
      background:white;
      padding:15px;
      margin:10px 0;
      border-radius:8px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .actions button {
      background:#2196F3;
      margin-left:5px;
      padding:6px 10px;
      font-size:14px;
      width:auto;
    }
    .actions button:last-child { background:#f44336; }

    .empty {
      text-align:center;
      color:#999;
      padding:15px;
      background:white;
      border-radius:8px;
    }

    @media (max-width: 520px) {
      .openings { grid-template-columns: 1fr; }
      .tally    { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>

<header>💰 Money Manager 2 Tally</header>

<!-- LOADING OVERLAY (hidden once Firebase is ready) -->
<div id="loading">
  <div class="spinner"></div>
  Loading…
</div>

<!-- LOGIN -->
<div id="loginDiv" style="display:none;">
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="appDiv" style="display:none;">

  <!-- ===== MANAGER SWITCHER ===== -->
  <div class="tabs">
    <button class="tab active" data-space="A" onclick="switchSpace('A')">📁 Manager 1</button>
    <button class="tab"        data-space="B" onclick="switchSpace('B')">📁 Manager 2</button>
  </div>

  <div class="space-label">Active: <span id="spaceName">Money Manager 1</span></div>

  <!-- TWO OPENING AMOUNTS -->
  <div class="box">
    <h3>Opening Amounts</h3>
    <div class="openings">

      <!-- Original (always visible) -->
      <div class="sub original">
        <h4>🟣 Original Opening</h4>
        <div class="body">
          <input type="number" id="openingInputOriginal" placeholder="Original amount">
          <button onclick="saveOpening('original')">Save Original</button>
        </div>
      </div>

      <!-- What-If (collapsed by default) -->
      <div class="sub whatif">
        <div class="head collapsed" id="whatifHead" onclick="toggleSection('whatif')">
          <span>🔵 What-If Opening</span>
          <span class="arrow">▼</span>
        </div>
        <div class="body" id="whatifBody" style="display:none;">
          <input type="number" id="openingInputWhatIf" placeholder="What-if amount">
          <button onclick="saveOpening('whatif')">Save What-If</button>
        </div>
      </div>

    </div>
  </div>

  <!-- TALLY (collapsed by default) -->
  <div class="box">
    <div class="head collapsed" id="tallyHead" onclick="toggleSection('tally')">
      <span>📊 Tally</span>
      <span class="arrow">▼</span>
    </div>
    <div class="body" id="tallyBody" style="display:none; margin-top:10px;">

      <div class="tally">
        <div class="opening">Original<br>₹<span id="opening">0.00</span></div>
        <div class="whatif">What-If<br>₹<span id="openingWhatIf">0.00</span></div>
        <div class="expense">Expenses<br>₹<span id="expense">0.00</span></div>
      </div>

      <div class="tally2">
        <div class="balance">Balance (Original)<br>₹<span id="balance">0.00</span></div>
        <div class="balance-w">Balance (What-If)<br>₹<span id="balanceWhatIf">0.00</span></div>
      </div>

    </div>
  </div>

  <!-- ADD EXPENSE -->
  <div class="box">
    <h3>Add Expense <small style="font-weight:normal;color:#666;">(shared inside this manager)</small></h3>
    <input type="text" id="desc" placeholder="Expense description">
    <input type="number" id="amount" placeholder="Amount spent">
    <button onclick="addExpense()">➕ Add Expense</button>
    <button onclick="logout()">Logout</button>
  </div>

  <h3>Expenses</h3>
  <div id="list"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  /* ============================================================
     FIREBASE CONFIG
     ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",
    authDomain: "striped-acrobat-342207.firebaseapp.com",
    databaseURL: "https://striped-acrobat-342207-default-rtdb.firebaseio.com",
    projectId: "striped-acrobat-342207",
    storageBucket: "striped-acrobat-342207.appspot.com",
    messagingSenderId: "367114842706",
    appId: "1:367114842706:web:0f6d504163ed3c72ed658b"
  };

  const app  = initializeApp(firebaseConfig);
  const db   = getDatabase(app);
  const auth = getAuth();

  /* ============================================================
     TWO SEPARATE MANAGERS
     ============================================================ */
  const SPACES = {
    A: { name: "Money Manager 1", path: "moneyManagerA" },
    B: { name: "Money Manager 2", path: "moneyManagerB" }
  };

  /* ---------- state ---------- */
  let currentSpace = localStorage.getItem("mm_space") || "A";
  let unsubOpenings = null;
  let unsubExpenses = null;

  let originalOpening = 0;
  let whatIfOpening   = 0;
  let totalExpense    = 0;

  /* ---------- helpers ---------- */
  const $ = id => document.getElementById(id);
  const money = n => Number(n || 0).toFixed(2);
  const escapeHtml = s => String(s).replace(/[&<>"']/g,
    c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

  function refreshTally() {
    $("opening").innerText       = money(originalOpening);
    $("openingWhatIf").innerText = money(whatIfOpening);
    $("expense").innerText       = money(totalExpense);
    $("balance").innerText       = money(originalOpening - totalExpense);
    $("balanceWhatIf").innerText = money(whatIfOpening   - totalExpense);
  }

  /* ---------- collapse toggles (What-If + Tally) ---------- */
  window.toggleSection = which => {
    const head = which === "whatif" ? $("whatifHead") : $("tallyHead");
    const body = which === "whatif" ? $("whatifBody") : $("tallyBody");
    const isCollapsed = head.classList.contains("collapsed");

    if (isCollapsed) {
      head.classList.remove("collapsed");
      body.style.display = "block";
    } else {
      head.classList.add("collapsed");
      body.style.display = "none";
    }
  };

  /* ---------- detach / attach listeners ---------- */
  function detach() {
    if (unsubOpenings) { unsubOpenings(); unsubOpenings = null; }
    if (unsubExpenses) { unsubExpenses(); unsubExpenses = null; }
  }

  function attach(spaceKey) {
    detach();

    const space       = SPACES[spaceKey];
    const openingsRef = ref(db, space.path + "/openings");
    const expenseRef  = ref(db, space.path + "/expenses");

    /* reset UI */
    originalOpening = 0;
    whatIfOpening   = 0;
    totalExpense    = 0;
    $("openingInputOriginal").value = "";
    $("openingInputWhatIf").value   = "";
    $("desc").value   = "";
    $("amount").value = "";
    $("list").innerHTML = "";
    refreshTally();

    /* header + tab highlight */
    $("spaceName").innerText = space.name;
    document.querySelectorAll(".tab").forEach(btn =>
      btn.classList.toggle("active", btn.dataset.space === spaceKey)
    );

    /* live openings */
    unsubOpenings = onValue(openingsRef, snap => {
      const v = snap.val() || {};
      originalOpening = Number(v.original || 0);
      whatIfOpening   = Number(v.whatif   || 0);
      refreshTally();
    });

    /* live expense list */
    unsubExpenses = onValue(expenseRef, snap => {
      const list = $("list");
      list.innerHTML = "";
      totalExpense = 0;

      if (!snap.exists()) {
        list.innerHTML = `<div class="empty">No expenses yet in ${escapeHtml(space.name)}.</div>`;
        refreshTally();
        return;
      }

      snap.forEach(child => {
        const val    = child.val() || {};
        const desc   = val.desc ?? "(no description)";
        const amount = Number(val.amount || 0);
        const id     = child.key;

        totalExpense += amount;

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div>
            <strong>${escapeHtml(desc)}</strong><br>
            ₹${money(amount)}
          </div>
          <div class="actions">
            <button onclick="editExpense('${id}', ${amount})">Edit</button>
            <button onclick="deleteExpense('${id}')">Delete</button>
          </div>`;
        list.prepend(div);
      });

      refreshTally();
    });
  }

  /* ---------- auth ---------- */
  onAuthStateChanged(auth, user => {
    /* hide loading overlay the first time auth resolves */
    $("loading").style.display = "none";

    $("loginDiv").style.display = user ? "none"  : "block";
    $("appDiv").style.display   = user ? "block" : "none";

    if (user) attach(currentSpace);
    else      detach();
  });

  window.login = () =>
    signInWithEmailAndPassword(auth, $("email").value, $("password").value)
      .catch(e => alert(e.message));

  window.logout = () => signOut(auth);

  /* ---------- switch manager ---------- */
  window.switchSpace = key => {
    if (!SPACES[key] || key === currentSpace) return;
    currentSpace = key;
    localStorage.setItem("mm_space", key);
    attach(key);
  };

  /* ---------- save opening amounts ---------- */
  window.saveOpening = which => {
    const openingsRef = ref(db, SPACES[currentSpace].path + "/openings");

    if (which === "original") {
      const v = parseFloat($("openingInputOriginal").value);
      if (isNaN(v)) { alert("Enter a valid Original amount."); return; }
      update(openingsRef, { original: v });
      $("openingInputOriginal").value = "";
    } else {
      const v = parseFloat($("openingInputWhatIf").value);
      if (isNaN(v)) { alert("Enter a valid What-If amount."); return; }
      update(openingsRef, { whatif: v });
      $("openingInputWhatIf").value = "";
    }
  };

  /* ---------- expenses ---------- */
  window.addExpense = () => {
    const d = $("desc").value.trim();
    const a = parseFloat($("amount").value);
    if (d && !isNaN(a) && a > 0) {
      push(ref(db, SPACES[currentSpace].path + "/expenses"), { desc: d, amount: a });
      $("desc").value   = "";
      $("amount").value = "";
    }
  };

  window.editExpense = (id, oldAmount) => {
    const n = parseFloat(prompt("Edit amount:", oldAmount));
    if (!isNaN(n) && n > 0) {
      update(ref(db, SPACES[currentSpace].path + "/expenses/" + id), { amount: n });
    }
  };

  window.deleteExpense = id => {
    if (confirm("Delete this expense?")) {
      remove(ref(db, SPACES[currentSpace].path + "/expenses/" + id));
    }
  };
</script>

</body>
</html>
